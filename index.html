<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0a1811">
  <title>Pente</title>

  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">

  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5045113084259802" crossorigin="anonymous"></script>
  <script src="app.js" defer></script>
</head>
<body>

  <div class="app-container">
    
    <!-- MENU SCREEN -->
    <div id="menu-screen" class="menu-screen">
      <h1 class="app-title">PENTE</h1>
      <div class="app-subtitle">Uma nova maneira de largar o papel e caneta para uma cartada</div>
      
      <div class="input-group">
        <input type="text" id="inputTeam1" class="glass-input" placeholder="Nome Equipa 1 (Opcional)" autocomplete="off" />
        <input type="text" id="inputTeam2" class="glass-input" placeholder="Nome Equipa 2 (Opcional)" autocomplete="off" />
        <input type="number" id="inputMaxScore" class="glass-input" placeholder="Riscos (ex. 10, Opcional)" min="1" inputmode="numeric" pattern="[0-9]*" />
      </div>
      
      <button type="button" id="btn-start" class="wood-btn btn-green btn-start">Jogar</button>
      
      <div id="pwa-install-toast" class="pwa-toast hidden">
        <span id="toast-text">📱 Toque aqui para instalar o PENTE no telemóvel</span>
        <button type="button" id="btn-close-toast" class="pwa-close-btn">✕</button>
      </div>
    </div>
        
    <!-- INSTALL MODAL -->
    <div id="install-modal" class="modal-overlay hidden">
      <div class="game-over-modal">
        <h2 class="modal-title">Como Instalar</h2>
        <div id="install-instructions-body" class="install-body"></div>
        <button type="button" id="btn-close-install-modal" class="wood-btn btn-green full-width-btn">Entendido</button>
      </div>
    </div>

    <!-- GAME SCREEN -->
    <div id="game-screen" class="game-screen hidden">
      
      <div class="score-cards-container">
        <div class="team-box team1">
          <span id="display-team1-name" class="team-name">Nós</span>
          <div class="card-deck">
            <span class="card-suit top-left">♠</span>
            <span id="display-team1-score">0</span>
            <span class="card-suit bottom-right">♠</span>
          </div>
        </div>

        <div class="team-box team2">
          <span id="display-team2-name" class="team-name">Vós</span>
          <div class="card-deck">
            <span class="card-suit top-left">♥</span>
            <span id="display-team2-score">0</span>
            <span class="card-suit bottom-right">♥</span>
          </div>
        </div>
      </div>

      <div class="canvas-container">
        <canvas id="trackCanvas"></canvas>
      </div>

      <div class="action-grid">
        <div class="action-col">
          <button id="btnT1_1" class="score-btn">Nós +1</button>
          <button id="btnT1_2" class="score-btn">Nós +2</button>
          <button id="btnT1_4" class="score-btn">Nós +4</button>
        </div>
        <div class="action-col">
          <button id="btnT2_1" class="score-btn">Vós +1</button>
          <button id="btnT2_2" class="score-btn">Vós +2</button>
          <button id="btnT2_4" class="score-btn">Vós +4</button>
        </div>
      </div>

      <div class="utility-row">
        <button id="btn-new-game" class="util-btn btn-new-game">Novo Jogo</button>
        <button id="btn-undo" class="util-btn btn-undo">← Anular</button>
      </div>

    </div>

    <!-- DIALOG MODAL -->
    <div id="modal-container" class="modal-overlay hidden">
      <div class="dialog-box">
        <div id="modal-title" class="dialog-title">Título</div>
        <div id="modal-text" class="dialog-text">Mensagem</div>
        <div class="dialog-buttons">
          <button id="modal-btn-sim" class="dialog-btn dialog-btn-sim">Sim</button>
          <button id="modal-btn-nao" class="dialog-btn dialog-btn-nao">Não</button>
        </div>
      </div>
    </div>

    <!-- AD FOOTER -->
    <footer class="app-footer">
      <div class="ad-container">
        <ins class="adsbygoogle"
          style="display:block"
          data-ad-client="ca-pub-5045113084259802"
          data-ad-slot="6603879821"
          data-ad-format="auto"
          data-full-width-responsive="true"></ins>
        <script>
            (adsbygoogle = window.adsbygoogle || []).push({});
        </script>
      </div>
    </footer>

  </div>

  <footer class="site-footer">
    <p>&copy; 2026 André Encarnação. All rights reserved.</p>
  </footer>

</body>
</html>
